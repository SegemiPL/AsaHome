# ============================================================================
# AsaHome — Development Docker Compose
# ============================================================================
# Starts PostgreSQL + Directus for local development.
# Next.js runs on the host (pnpm dev) for hot reload.
#
# Usage:
#   docker compose -f infrastructure/compose/docker-compose.dev.yml up -d
#   docker compose -f infrastructure/compose/docker-compose.dev.yml down -v
# ============================================================================

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: asahome-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asahome}
      POSTGRES_USER: ${POSTGRES_USER:-asahome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asahome}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asahome}"]
      interval: 5s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:11.6.1
    container_name: asahome-directus-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-asahome}
      DB_USER: ${POSTGRES_USER:-asahome}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-asahome}

      KEY: ${DIRECTUS_KEY:-dev-key-change-in-production}
      SECRET: ${DIRECTUS_SECRET:-dev-secret-change-in-production}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@asahome.local}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin123}

      PUBLIC_URL: http://localhost:8055
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:3000"

      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: ./uploads

      # Disable telemetry
      TELEMETRY: "false"
    ports:
      - "8055:8055"
    volumes:
      - directus-uploads-dev:/directus/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8055/server/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-dev:
  directus-uploads-dev:
