# ============================================================================
# AsaHome — Production Docker Compose
# ============================================================================
# WARNING: This is a baseline template. Review and customize before deploying.
# Secrets MUST be provided via environment or .env file (never committed).
#
# Phase 1 services: Nginx + Next.js + Directus + PostgreSQL
# Phase 2 adds: FastAPI + Redis (uncomment when ready)
# ============================================================================

services:
  nginx:
    image: nginx:1.28.0-alpine
    container_name: asahome-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      # TLS certificates (mount from host or named volume)
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: asahome-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ADMIN_TOKEN: ${DIRECTUS_ADMIN_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    depends_on:
      directus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  directus:
    image: directus/directus:11.6.1
    container_name: asahome-directus
    restart: unless-stopped
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${NEXT_PUBLIC_SITE_URL}

      STORAGE_LOCATIONS: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads

      TELEMETRY: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - directus-uploads:/directus/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8055/server/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16.4-alpine
    container_name: asahome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

