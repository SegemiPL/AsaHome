# ============================================================================
# AsaHome Virtual Host — Production
# ============================================================================
# Phase 1 serves: Next.js web + Directus admin on subdomain
# TLS termination is configured here. Adjust server_name and cert paths.
# ============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name asahome.example;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name cms.asahome.example;
    return 301 https://$host$request_uri;
}

# ---- Main site (Next.js) ----
server {
    listen 443 ssl http2;
    server_name asahome.example;

    # ssl_certificate     /etc/nginx/certs/asahome.pem;
    # ssl_certificate_key /etc/nginx/certs/asahome.key;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'" always;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check — no logging noise
    location /health {
        proxy_pass http://web:3000;
        access_log off;
    }
}

# ---- CMS (Directus) admin subdomain ----
server {
    listen 443 ssl http2;
    server_name cms.asahome.example;

    # ssl_certificate     /etc/nginx/certs/cms.asahome.pem;
    # ssl_certificate_key /etc/nginx/certs/cms.asahome.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optional: IP restriction for admin access
    # allow 1.2.3.4;
    # deny all;

    location / {
        proxy_pass http://directus:8055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Larger body for uploads
        client_max_body_size 50m;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
